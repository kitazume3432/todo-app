<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #ffffff; --bg-secondary: #f5f5f4; --bg-danger: #fcebeb;
    --text: #1a1a1a; --text-secondary: #6b6b6b;
    --border: rgba(0,0,0,0.12); --border-hover: rgba(0,0,0,0.25);
    --radius-md: 8px; --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1c; --bg-secondary:#2a2a2a; --bg-danger:#3a1f1f; --text:#e8e8e8; --text-secondary:#999; --border:rgba(255,255,255,0.12); --border-hover:rgba(255,255,255,0.25); }
    select option{background:var(--bg);color:var(--text)}
    .must-when{background:rgba(28,28,28,0.55)!important;border-color:rgba(255,255,255,0.07)!important}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
  .container{max-width:960px;margin:0 auto;padding:24px 16px}
  h1{font-size:20px;font-weight:500;margin-bottom:20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
  .stat-card{background:var(--bg-secondary);border-radius:var(--radius-md);padding:10px 14px}
  .stat-label{font-size:12px;color:var(--text-secondary);margin-bottom:2px}
  .stat-num{font-size:20px;font-weight:500}
  .assignee-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:5px 12px;border-radius:99px;font-size:12px;cursor:pointer;border:0.5px solid var(--border-hover);background:var(--bg);color:var(--text-secondary);white-space:nowrap}
  .chip.active{background:var(--bg-secondary);color:var(--text);border-color:var(--text-secondary);font-weight:500}
  .chip:hover{border-color:var(--text-secondary);color:var(--text)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input[type=text],input[type=date],select,textarea{background:var(--bg);color:var(--text);border:0.5px solid var(--border-hover);border-radius:var(--radius-md);padding:0 12px;height:36px;font-size:14px;font-family:var(--font);outline:none}
  input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--text-secondary);box-shadow:0 0 0 2px rgba(0,0,0,0.06)}
  textarea{height:auto;padding:8px 12px;resize:vertical}
  select{cursor:pointer}
  .toolbar input[type=text]{flex:1;min-width:120px}
  .toolbar select{min-width:110px}
  .btn{background:var(--bg);border:0.5px solid var(--border-hover);border-radius:var(--radius-md);padding:0 14px;height:36px;cursor:pointer;font-size:14px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font)}
  .btn:hover{background:var(--bg-secondary)} .btn:active{transform:scale(0.98)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;padding:8px 10px;font-size:12px;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--text)}
  tbody tr:hover{background:var(--bg-secondary);background-color:var(--bg-secondary)}
  tbody tr[style*="cursor:pointer"]:hover td{background:var(--bg-secondary)}
  tbody td{padding:8px 10px;vertical-align:middle}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius-md);font-weight:500}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;border-radius:4px;font-size:16px;line-height:1}
  .icon-btn:hover{color:var(--text);background:var(--bg-secondary)}
  .overdue{color:#A32D2D;font-weight:500}
  .empty{text-align:center;padding:2rem;color:var(--text-secondary);font-size:14px}
  td select{height:28px;font-size:12px;padding:2px 6px;border-radius:var(--radius-md)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;padding:24px 16px}
  .modal-overlay.open{display:flex}
  .modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);width:360px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden}
  .modal-header{padding:1.25rem 1.25rem 0.5rem;flex-shrink:0}
  .modal-header h2{font-size:15px;font-weight:500}
  .modal-body{padding:0 1.25rem 1rem;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
  .modal-footer{padding:0.75rem 1.25rem 1.25rem;flex-shrink:0;border-top:0.5px solid var(--border);background:var(--bg)}
  .form-row{margin-bottom:10px} .form-row label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
  .form-row input,.form-row select,.form-row textarea{width:100%} .form-row textarea{height:64px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .status-radio{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 4px;border-radius:var(--radius-md);border:0.5px solid var(--border-hover);cursor:pointer;font-size:13px;transition:background 0.1s}
  .status-radio:has(input:checked){background:var(--bg-secondary);border-color:var(--text-secondary);font-weight:500}
  .status-radio input{display:none}
  .date-quick{background:none;border:0.5px solid var(--border-hover);border-radius:99px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--text-secondary);font-family:var(--font)}
  .date-quick:hover{background:var(--bg-secondary);color:var(--text)}
  .fab{position:fixed;bottom:28px;right:28px;width:56px;height:56px;border-radius:50%;background:#1A6FD4;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 16px rgba(26,111,212,0.45);z-index:50;transition:transform 0.15s,box-shadow 0.15s}
  .fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(26,111,212,0.55)}
  .fab:active{transform:scale(0.96)}
  .fab-label{position:fixed;bottom:36px;right:92px;background:var(--bg);border:0.5px solid var(--border-hover);border-radius:var(--radius-md);padding:6px 12px;font-size:13px;color:var(--text);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s}
  .fab:hover ~ .fab-label, .fab-label:hover{opacity:1}
  /* Sync status */
  .sync-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text-secondary)}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0}
  .sync-dot.ok{background:#6abf6a} .sync-dot.err{background:#e05c5c} .sync-dot.loading{background:#f0a500;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .saving-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.15);align-items:center;justify-content:center}
  .saving-overlay.show{display:flex}
  .saving-box{background:var(--bg);border-radius:var(--radius-lg);padding:20px 32px;font-size:14px;color:var(--text-secondary);border:0.5px solid var(--border)}
  .must-box{border:0.5px solid var(--border-hover);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:18px;background:var(--bg-secondary)}
  .must-title{font-size:13px;font-weight:600;margin-bottom:8px}
  .must-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;border-bottom:0.5px solid var(--border)}
  .must-item:last-of-type{border-bottom:none}
  .must-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;flex-shrink:0}
  .must-main{flex:1;min-width:0}
  .must-title-text{word-break:break-word;cursor:text}
  .must-sub{font-size:11px;color:var(--text-secondary);margin-top:1px}
  .must-sub.over{color:#A32D2D;font-weight:500}
  .must-done{height:26px;font-size:12px;padding:0 10px;flex-shrink:0}
  .must-item.editing{flex-wrap:wrap}
  .must-item.editing input[type=text].must-edit-title{min-width:140px}
  .must-item input.must-edit-date{width:130px;flex:none}
  .must-item input[type=text]{flex:1;min-width:0;height:30px;font-size:14px}
  .must-when{flex:none;font-size:12px;color:var(--text-secondary);background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.07);border-radius:99px;padding:1px 9px;cursor:pointer;white-space:nowrap}
  .must-when.over{color:#A32D2D;border-color:#A32D2D;font-weight:500}
  .must-when.none{opacity:0.55}
  .must-item input[type=date]{height:30px;font-size:13px;padding:0 6px}
  .must-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .must-add input.must-when-input{width:170px;flex:none}
  .must-item input.must-edit-when{flex:none;width:110px}
  .must-add input{flex:1;min-width:0}
  @media (max-width:520px){
    .container{padding:14px 8px}
    h1{font-size:17px;margin-bottom:12px}
    .stats{gap:6px}
    .stat-card{padding:7px 8px}
    .stat-num{font-size:16px}
    table{font-size:12.5px}
    thead th{padding:6px 6px;font-size:11px}
    tbody td{padding:6px 6px}
    td select{font-size:11px;padding:2px 4px}
    .chip{padding:4px 9px;font-size:11px}
  }
</style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-checkbox" style="font-size:20px;vertical-align:-2px;margin-right:6px"></i>TODO管理</h1>
  <div class="sync-bar">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-msg">Notionに接続中...</span>
    <button class="btn" style="margin-left:auto;height:28px;font-size:12px" onclick="loadFromNotion()"><i class="ti ti-refresh" style="font-size:14px"></i>再読み込み</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="assignee-chips" id="assignee-chips"></div>
  <div class="must-box">
    <div class="must-title">📌 やらなくてはいけないこと</div>
    <div id="must-list"></div>
    <datalist id="when-list"><option value="1週間ごと"><option value="2週間ごと"><option value="1か月ごと"><option value="2か月ごと"><option value="3か月ごと"><option value="半年ごと"><option value="1年ごと"><option value="随時"></datalist>
    <div class="must-add">
      <input type="text" id="must-input" placeholder="やることを追加（Enterで追加）">
      <input type="text" id="must-when" class="must-when-input" list="when-list" placeholder="いつ（例：1か月ごと）">
      <button class="btn" onclick="addMust()">追加</button>
    </div>
  </div>
  <div id="list-view">
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th onclick="sortBy('title')">タイトル <i class="ti ti-selector" style="font-size:11px"></i></th>
        <th onclick="sortBy('assignee')">担当者 <i class="ti ti-selector" style="font-size:11px"></i></th>
        <th onclick="sortBy('start')">作業日 <i class="ti ti-selector" style="font-size:11px"></i></th>
        <th onclick="sortBy('due')">期限日 <i class="ti ti-selector" style="font-size:11px"></i></th>
        <th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><h2 id="modal-title">✏️ タスクを追加</h2></div>
    <div class="modal-body">

    <div class="form-row">
      <label>📝 タイトル <span style="color:#A32D2D">*</span></label>
      <input type="text" id="m-title" placeholder="例：資料作成、ミーティング準備など">
    </div>

    <div class="form-row">
      <label>💬 説明・メモ</label>
      <textarea id="m-desc" placeholder="詳細や備考があれば入力"></textarea>
    </div>


    <div class="form-row">
      <label>👤 担当者</label>
      <select id="m-assignee" onchange="onAssigneeChange()"></select>
      <input type="text" id="m-assignee-new" placeholder="新しい担当者の名前" style="display:none;margin-top:6px">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-row">
        <label>📅 作業日</label>
        <input type="date" id="m-start">
        <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
          <button type="button" class="date-quick" onclick="setDateQuick('m-start',0)">今日</button>
          <button type="button" class="date-quick" onclick="setDateQuick('m-start',1)">明日</button>
          <button type="button" class="date-quick" onclick="setDateQuick('m-start',14)">2週間後</button>
        </div>
      </div>
      <div class="form-row">
        <label>⏰ 期限日</label>
        <input type="date" id="m-due">
        <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
          <button type="button" class="date-quick" onclick="setDateQuick('m-due',0)">今日</button>
          <button type="button" class="date-quick" onclick="setDateQuick('m-due',1)">明日</button>
          <button type="button" class="date-quick" onclick="setDateQuick('m-due',14)">2週間後</button>
        </div>
      </div>
    </div>

    <div class="form-row">
      <label>🔁 繰り返し</label>
      <select id="m-recur" onchange="updateRecurDetail()">
        <option value="なし">なし</option>
        <option value="毎日">毎日</option>
        <option value="毎週">毎週</option>
        <option value="毎月">毎月</option>
        <option value="毎月最終日">毎月最終日</option>
        <option value="毎月第◯曜日">毎月第◯◯曜</option>
        <option value="毎年第◯曜日">毎年◯月第◯◯曜</option>
      </select>

      <div id="recur-detail-week" style="display:none;margin-top:8px">
        <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">第何週</label>
        <select id="m-recur-week" style="width:100%">
          <option value="1">第1</option><option value="2">第2</option><option value="3">第3</option>
          <option value="4">第4</option><option value="5">第5</option><option value="-1">最終</option>
        </select>
      </div>

      <div id="recur-detail-weekday" style="display:none;margin-top:8px">
        <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">曜日</label>
        <select id="m-recur-weekday" style="width:100%">
          <option value="0">日曜日</option><option value="1">月曜日</option><option value="2">火曜日</option>
          <option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option>
          <option value="6">土曜日</option>
        </select>
      </div>

      <div id="recur-detail-month" style="display:none;margin-top:8px">
        <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">月</label>
        <select id="m-recur-month" style="width:100%">
          <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
          <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
          <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
          <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
      </div>

      <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">チェックを入れて完了にすると自動で次回分のタスクが作成されます</div>
    </div>

    </div>
    <div class="modal-footer">
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">キャンセル</button>
        <button class="btn" style="background:var(--bg-secondary);font-weight:500" onclick="saveTask()">💾 保存する</button>
      </div>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()" aria-label="タスクを追加"><i class="ti ti-plus" aria-hidden="true"></i></button>
<div class="fab-label">タスクを追加</div>

<div class="saving-overlay" id="saving-overlay">
  <div class="saving-box"><i class="ti ti-loader" style="animation:pulse 1s infinite;margin-right:6px"></i>Notionに保存中...</div>
</div>

<script>
// ====== Notion設定 ======
const PROXY = 'https://icy-mud-2768.kitazume.workers.dev';

// ====== 状態 ======
const today = new Date(); today.setHours(0,0,0,0);
let tasks = [], mustItems = [], sortKey = '', sortAsc = true, editId = null, activeAssignee = '';
const MUST_STATUS = 'リスト';

function parseDate(s){if(!s)return null;const d=new Date(s);d.setHours(0,0,0,0);return d;}
function fmtDisp(s){if(!s)return'—';const parts=s.split('-');if(parts.length!==3)return s.replace(/-/g,'/');return `${Number(parts[1])}/${Number(parts[2])}`;}
function daysFromToday(n){const d=new Date(today);d.setDate(d.getDate()+n);return d;}

// ====== 担当者カラーパレット ======
const ASSIGNEE_COLORS = ['#4A90D9','#E8734A','#5BAD6F','#9B6FD4','#D4A017','#D45F8A','#3ABFBF','#8B6F47'];
const assigneeColorMap = {};
let colorIndex = 0;
function assigneeColor(name){
  if(!name) return '#ccc';
  if(!assigneeColorMap[name]){ assigneeColorMap[name]=ASSIGNEE_COLORS[colorIndex%ASSIGNEE_COLORS.length]; colorIndex++; }
  return assigneeColorMap[name];
}

// ====== 同期ステータス表示 ======
function setSyncStatus(state, msg){
  const dot = document.getElementById('sync-dot');
  document.getElementById('sync-msg').textContent = msg;
  dot.className = 'sync-dot ' + state;
}

// ====== Notion API呼び出し（キーはWorkers側で管理） ======
async function notionRequest(path, method='GET', body=null){
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`, opts);
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||'Notion APIエラー');}
  return res.json();
}

// ====== NotionページをタスクオブジェクトにMAP ======
function pageToTask(page){
  const p = page.properties;
  const getProp = (name, type) => {
    if(!p[name]) return '';
    if(type==='title') return p[name].title?.map(t=>t.plain_text).join('')||'';
    if(type==='rich_text') return p[name].rich_text?.map(t=>t.plain_text).join('')||'';
    if(type==='date') return p[name].date?.start||'';
    if(type==='select') return p[name].select?.name||'';
    return '';
  };
  return {
    id: page.id,
    notionId: page.id,
    title: getProp('タイトル','title'),
    desc: getProp('説明','rich_text'),
    assignee: getProp('担当者','rich_text'),
    start: getProp('作業日','date'),
    due: getProp('期限日','date'),
    status: getProp('ステータス','select')||'未着手',
    recur: getProp('繰り返し','select')||'なし',
    recurWeekday: getProp('繰り返し曜日','rich_text'),
    recurMonth: getProp('繰り返し月','rich_text'),
    recurWeek: getProp('繰り返し週','rich_text'),
  };
}

// ====== Notionからデータ読み込み ======
async function queryAllPages(useFilter){
  let results=[], cursor=null, pages=0;
  do{
    const body={page_size:100};
    if(useFilter) body.filter={property:'ステータス',select:{does_not_equal:'完了'}};
    if(cursor) body.start_cursor=cursor;
    const data=await notionRequest(`/databases/37ee4022213780cdb770d787ccf00af1/query`,'POST',body);
    results=results.concat(data.results);
    cursor=data.has_more?data.next_cursor:null;
    pages++;
  }while(cursor&&pages<20);
  return results;
}

async function loadFromNotion(){
  setSyncStatus('loading','Notionに接続中...');
  try {
    let results;
    try{ results=await queryAllPages(true); }
    catch(e){ results=await queryAllPages(false); }
    const all = results.filter(p=>!p.archived).map(pageToTask);
    mustItems = all.filter(t=>t.status===MUST_STATUS);
    tasks = all.filter(t=>t.status!==MUST_STATUS&&t.status!=='完了');
    setSyncStatus('ok',`${tasks.length}件のタスクを読み込みました（最終更新: ${new Date().toLocaleTimeString('ja-JP')}）`);
    render();
  } catch(e){
    setSyncStatus('err','読み込み失敗: '+e.message);
  }
}

// ====== Notionにタスク作成 ======
async function createInNotion(data){
  return notionRequest('/pages','POST',{
    parent:{database_id:'37ee4022213780cdb770d787ccf00af1'},
    properties: buildProperties(data),
  });
}

// ====== Notionのタスク更新 ======
async function updateInNotion(notionId, data){
  return notionRequest(`/pages/${notionId}`,'PATCH',{
    properties: buildProperties(data),
  });
}

// ====== Notionのタスク削除（アーカイブ） ======
async function deleteInNotion(notionId){
  return notionRequest(`/pages/${notionId}`,'PATCH',{archived:true});
}

function buildProperties(data){
  return {

  };
}

// 指定した年月の「第n◯曜日」を返す（n=-1で最終週）
function nthWeekdayOfMonth(year, month, weekday, week){
  if(week === -1){
    const lastDay = new Date(year, month, 0);
    const lastDow = lastDay.getDay();
    let diff = lastDow - weekday;
    if(diff < 0) diff += 7;
    lastDay.setDate(lastDay.getDate() - diff);
    lastDay.setHours(0,0,0,0);
    return lastDay;
  }
  const firstDay = new Date(year, month-1, 1);
  const firstDow = firstDay.getDay();
  let diff = weekday - firstDow;
  if(diff < 0) diff += 7;
  const day = 1 + diff + (week-1)*7;
  const result = new Date(year, month-1, day);
  result.setHours(0,0,0,0);
  return result;
}

function fmtYMD(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ====== 繰り返し日付の計算 ======
function addInterval(dateStr, recur, opts={}){
  if(!dateStr) return '';
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  if(recur==='毎日'){ d.setDate(d.getDate()+1); return fmtYMD(d); }
  if(recur==='毎週'){ d.setDate(d.getDate()+7); return fmtYMD(d); }
  if(recur==='毎月'){ d.setMonth(d.getMonth()+1); return fmtYMD(d); }
  if(recur==='毎月最終日'){ return fmtYMD(new Date(d.getFullYear(), d.getMonth()+2, 0)); }
  if(recur==='毎月第◯曜日'){
    const weekday = opts.weekday!=null ? opts.weekday : d.getDay();
    const week = opts.week!=null ? opts.week : 1;
    let y=d.getFullYear(), m=d.getMonth()+1+1; // 翌月
    if(m>12){m=1;y++;}
    return fmtYMD(nthWeekdayOfMonth(y,m,weekday,week));
  }
  if(recur==='毎年第◯曜日'){
    const weekday = opts.weekday!=null ? opts.weekday : d.getDay();
    const week = opts.week!=null ? opts.week : 1;
    const month = opts.month!=null ? opts.month : d.getMonth()+1;
    return fmtYMD(nthWeekdayOfMonth(d.getFullYear()+1, month, weekday, week));
  }
  return '';
}

// 完了時に次回分のタスクを自動作成
async function createNextRecurrence(t){
  if(!t.recur || t.recur==='なし') return;
  const opts = {
    weekday: t.recurWeekday!=null && t.recurWeekday!=='' ? Number(t.recurWeekday) : null,
    month: t.recurMonth!=null && t.recurMonth!=='' ? Number(t.recurMonth) : null,
    week: t.recurWeek!=null && t.recurWeek!=='' ? Number(t.recurWeek) : null,
  };
  const nextStart = addInterval(t.start || t.due, t.recur, opts);
  const nextDue   = t.due ? addInterval(t.due, t.recur, opts) : '';
  const nextData = {
    title: t.title, desc: t.desc, assignee: t.assignee,
    start: nextStart, due: nextDue,
    status: '未着手', recur: t.recur,
    recurWeekday: t.recurWeekday, recurMonth: t.recurMonth, recurWeek: t.recurWeek,
  };
  try{
    const page = await createInNotion(nextData);
    tasks.push({...nextData, id:page.id, notionId:page.id});
  }catch(e){
    console.warn('次回分の作成に失敗:', e);
  }
}

function getAssignees(){return[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].sort();}

function assigneesByCount(){
  const counts={};
  tasks.filter(t=>t.status!=='完了').forEach(t=>{if(t.assignee)counts[t.assignee]=(counts[t.assignee]||0)+1;});
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
}

function renderList(){
  const rows=getFiltered();
  // 作業日（start）を優先、なければ期限日（due）で判定
  const getKey = t => parseDate(t.start) || parseDate(t.due);
  const wk=['日','月','火','水','木','金','土'];
  const weekEnd=daysFromToday(6);
  const overdueTasks=rows.filter(t=>{const d=getKey(t);return d&&d<today;});
  const laterTasks=rows.filter(t=>{const d=getKey(t);return !d||d>weekEnd;})
    .sort((a,b)=>{const da=getKey(a),db=getKey(b);if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da-db;});

  let html='';
  if(overdueTasks.length){
    html += sectionHeader('⚠ 期限超過', overdueTasks.length, '#A32D2D');
    html += overdueTasks.map(taskRow).join('');
  }
  const heads=['📅 今日','🌅 明日','📆 明後日'];
  for(let i=0;i<7;i++){
    const day=daysFromToday(i);
    const list=rows.filter(t=>{const d=getKey(t);return d&&d.getTime()===day.getTime();});
    const dateLabel=`${day.getMonth()+1}/${day.getDate()}(${wk[day.getDay()]})`;
    const label=(i<3?heads[i]:'📆')+' '+dateLabel;
    const color=i===0?'#1A6FD4':(i===1?'#5B9BD5':'#7CA9D9');
    html += sectionHeader(label, list.length, color);
    html += list.map(taskRow).join('');
  }
  if(laterTasks.length){
    html += sectionHeader('📋 それ以降・日付なし', laterTasks.length, 'var(--text-secondary)');
    html += laterTasks.map(taskRow).join('');
  }
  document.getElementById('tbody').innerHTML = html;
}

// ====== やらなくてはいけないことリスト ======
// 「いつ」＝目安の周期（例：1か月ごと）→ Notionの「説明」欄
// 「前回やった日」→ Notionの「作業日」欄。次の目安日は周期と前回から計算する
// --- cycle helpers start
function parseCycle(text){
  if(!text)return null;
  const t=String(text).normalize('NFKC');
  let m;
  if(/半年/.test(t))return {unit:'m',n:6};
  if((m=t.match(/(\d+)\s*年/)))return {unit:'m',n:12*Number(m[1])};
  if((m=t.match(/(\d+)\s*[かカヶケ]?\s*月/)))return {unit:'m',n:Number(m[1])};
  if((m=t.match(/(\d+)\s*週/)))return {unit:'d',n:7*Number(m[1])};
  if((m=t.match(/(\d+)\s*日/)))return {unit:'d',n:Number(m[1])};
  if(/毎日/.test(t))return {unit:'d',n:1};
  if(/毎週/.test(t))return {unit:'d',n:7};
  if(/毎月/.test(t))return {unit:'m',n:1};
  if(/毎年/.test(t))return {unit:'m',n:12};
  return null;
}
function addMonthsClamped(date,n){
  const d=new Date(date);
  const day=d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,last));
  d.setHours(0,0,0,0);
  return d;
}
// 戻り値: {cycle, last, next, days} / 周期が読み取れない場合は null
function mustSchedule(t){
  const cycle=parseCycle(t.desc);
  if(!cycle||cycle.n<=0)return null;
  const last=parseDate(t.start);
  if(!last)return {cycle,last:null,next:null,days:null};
  let next;
  if(cycle.unit==='d'){next=new Date(last);next.setDate(next.getDate()+cycle.n);next.setHours(0,0,0,0);}
  else next=addMonthsClamped(last,cycle.n);
  const days=Math.round((next-today)/86400000);
  return {cycle,last,next,days};
}
function mustSortKey(t){
  const sc=mustSchedule(t);
  if(!sc)return Infinity;
  if(!sc.next)return today.getTime();
  return sc.next.getTime();
}
// --- cycle helpers end

function sortedMust(){
  return mustItems.map((t,i)=>({t,i,k:mustSortKey(t)}))
    .sort((a,b)=>a.k===b.k?a.i-b.i:(a.k<b.k?-1:1)).map(x=>x.t);
}

function mustSubText(t){
  const sc=mustSchedule(t);
  if(!sc)return '';
  if(!sc.last)return '<div class="must-sub over">未実施</div>';
  let tail;
  if(sc.days<0)tail=`⚠ ${-sc.days}日超過`;
  else if(sc.days===0)tail='今日が目安';
  else tail=`あと${sc.days}日`;
  return `<div class="must-sub${sc.days<=0?' over':''}">前回 ${fmtDisp(t.start)} ・ 次 ${fmtDisp(fmtYMD(sc.next))}（${tail}）</div>`;
}

function renderMust(){
  const el=document.getElementById('must-list');
  if(!el)return;
  if(mustItems.length===0){
    el.innerHTML='<div style="font-size:13px;color:var(--text-secondary)">まだありません</div>';
    return;
  }
  el.innerHTML=sortedMust().map(t=>{
    const when=t.desc?`<span class="must-when" onclick="editMust('${t.notionId}')" title="クリックで編集">${t.desc.replace(/</g,'&lt;')}</span>`
                     :`<span class="must-when none" onclick="editMust('${t.notionId}')" title="いつ？を設定">いつ？</span>`;
    const doneBtn=parseCycle(t.desc)?`<button class="btn must-done" onclick="doneMustToday('${t.notionId}')" title="今日やった日として記録">やった</button>`:'';
    return `<div class="must-item" id="must-${t.notionId}">${when}<div class="must-main"><span class="must-title-text" onclick="editMust('${t.notionId}')" title="クリックで編集">${t.title.replace(/</g,'&lt;')}</span>${mustSubText(t)}</div>${doneBtn}<button class="icon-btn" onclick="editMust('${t.notionId}')" aria-label="編集"><i class="ti ti-pencil"></i></button><button class="icon-btn" onclick="deleteMust('${t.notionId}')" aria-label="削除"><i class="ti ti-trash"></i></button></div>`;
  }).join('');
}

async function doneMustToday(notionId){
  const t=mustItems.find(t=>t.notionId===notionId);
  if(!t)return;
  const old=t.start;
  t.start=fmtYMD(today);
  renderMust();
  try{
    await updateInNotion(notionId,t);
    setSyncStatus('ok','やった日を記録しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
  }catch(e){
    t.start=old;
    renderMust();
    setSyncStatus('err','保存失敗: '+e.message);
  }
}

function editMust(notionId){
  const t=mustItems.find(t=>t.notionId===notionId);
  const row=document.getElementById('must-'+notionId);
  if(!t||!row||row.querySelector('input[type=text]'))return;
  row.classList.add('editing');
  row.innerHTML=`<input type="text" class="must-edit-when" list="when-list" placeholder="いつ"><input type="text" class="must-edit-title" placeholder="やること"><input type="date" class="must-edit-date" title="前回やった日"><button class="icon-btn" data-act="save" aria-label="保存" title="保存"><i class="ti ti-check"></i></button><button class="icon-btn" data-act="cancel" aria-label="キャンセル" title="キャンセル"><i class="ti ti-x"></i></button>`;
  const whenInput=row.querySelector('.must-edit-when');
  const titleInput=row.querySelector('.must-edit-title');
  const dateInput=row.querySelector('.must-edit-date');
  whenInput.value=t.desc||'';
  titleInput.value=t.title;
  dateInput.value=t.start||'';
  let done=false, cancelling=false;
  const finish=async(save)=>{
    if(done)return;
    done=true;
    const v=titleInput.value.trim();
    const when=whenInput.value.trim();
    const last=dateInput.value;
    if(!save||!v||(v===t.title&&when===(t.desc||'')&&last===(t.start||''))){renderMust();return;}
    const old={title:t.title,desc:t.desc,start:t.start};
    t.title=v; t.desc=when; t.start=last; t.due='';
    renderMust();
    try{
      await updateInNotion(notionId,t);
      setSyncStatus('ok','保存しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
    }catch(e){
      t.title=old.title; t.desc=old.desc; t.start=old.start;
      renderMust();
      setSyncStatus('err','保存失敗: '+e.message);
    }
  };
  const onKey=e=>{
    if(e.isComposing)return;
    if(e.key==='Enter')finish(true);
    else if(e.key==='Escape'){e.stopPropagation();finish(false);}
  };
  whenInput.addEventListener('keydown',onKey);
  titleInput.addEventListener('keydown',onKey);
  row.querySelector('[data-act="save"]').addEventListener('click',()=>finish(true));
  const cancelBtn=row.querySelector('[data-act="cancel"]');
  cancelBtn.addEventListener('pointerdown',()=>{cancelling=true;});
  cancelBtn.addEventListener('click',()=>finish(false));
  row.addEventListener('focusout',()=>{
    setTimeout(()=>{
      if(done||row.contains(document.activeElement))return;
      finish(!cancelling);
    },0);
  });
  titleInput.focus();
  titleInput.select();
}

async function addMust(){
  const input=document.getElementById('must-input');
  const whenEl=document.getElementById('must-when');
  const title=input.value.trim();
  if(!title)return;
  const when=whenEl.value.trim();
  input.value='';
  whenEl.value='';
  try{
    const data={title,desc:when,assignee:'',start:'',due:'',status:MUST_STATUS,recur:'なし',recurWeekday:'',recurMonth:'',recurWeek:''};
    const page=await createInNotion(data);
    mustItems.push({...data,id:page.id,notionId:page.id});
    renderMust();
    setSyncStatus('ok','追加しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
  }catch(e){setSyncStatus('err','追加失敗: '+e.message);alert('追加に失敗しました。\n'+e.message);}
}

async function deleteMust(notionId){
  const t=mustItems.find(t=>t.notionId===notionId);
  if(!t||!confirm('「'+t.title+'」を削除しますか？'))return;
  mustItems=mustItems.filter(t=>t.notionId!==notionId);
  renderMust();
  try{
    await deleteInNotion(notionId);
    setSyncStatus('ok','削除しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
  }catch(e){setSyncStatus('err','削除失敗: '+e.message);}
}

function handleRowClick(event, notionId){
  if(event.target.closest('select,button,input')) return;
  openModal(notionId);
}

function render(){renderStats();renderChips();renderList();renderMust();}
function sortBy(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true;}renderList();}

async function completeTask(notionId){
  const t=tasks.find(t=>t.notionId===notionId);
  if(!t)return;
  const old=t.status;
  t.status='完了';
  render();
  try{
    await updateInNotion(notionId,t);
    if(t.recur && t.recur!=='なし'){
      await createNextRecurrence(t);
      render();
    }
    setSyncStatus('ok','完了にしました（'+new Date().toLocaleTimeString('ja-JP')+'）');
  }catch(e){
    t.status=old;
    render();
    setSyncStatus('err','保存失敗: '+e.message);
  }
}

async function deleteTask(notionId){
  if(!confirm('このタスクを削除しますか？'))return;
  tasks=tasks.filter(t=>t.notionId!==notionId);
  render();
  try{
    await deleteInNotion(notionId);
    setSyncStatus('ok','削除しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
  }catch(e){setSyncStatus('err','削除失敗: '+e.message);}
}


function updateRecurDetail(){
  const v = document.getElementById('m-recur').value;
  const showWeek = (v==='毎月第◯曜日'||v==='毎年第◯曜日');
  document.getElementById('recur-detail-week').style.display = showWeek ? '' : 'none';
  document.getElementById('recur-detail-weekday').style.display = showWeek ? '' : 'none';
  document.getElementById('recur-detail-month').style.display = (v==='毎年第◯曜日') ? '' : 'none';
}

function setDateQuick(id, days){
  const d = new Date(today); d.setDate(d.getDate()+days);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  document.getElementById(id).value = `${y}-${m}-${day}`;
}

function openModal(notionId){
  editId=notionId||null;
  const t=notionId?tasks.find(t=>t.notionId===notionId):{};
  document.getElementById('modal-title').textContent=notionId?'✏️ タスクを編集':'✏️ タスクを追加';
  document.getElementById('m-title').value=t.title||'';
  document.getElementById('m-desc').value=t.desc||'';
  fillAssigneeSelect(t.assignee||'');
  document.getElementById('m-start').value=t.start||'';
  document.getElementById('m-due').value=t.due||'';
  // 繰り返し
  document.getElementById('m-recur').value = t.recur||'なし';
  document.getElementById('m-recur-week').value = (t.recurWeek!=null && t.recurWeek!=='') ? t.recurWeek : '1';
  document.getElementById('m-recur-weekday').value = (t.recurWeekday!=null && t.recurWeekday!=='') ? t.recurWeekday : String(today.getDay());
  document.getElementById('m-recur-month').value = (t.recurMonth!=null && t.recurMonth!=='') ? t.recurMonth : String(today.getMonth()+1);
  updateRecurDetail();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-title').focus(),100);
}
function fillAssigneeSelect(current){
  const sel=document.getElementById('m-assignee');
  const names=assigneesByCount();
  if(current&&!names.includes(current))names.push(current);
  sel.innerHTML='<option value="">（未設定）</option>'
    +names.map(a=>`<option value="${a.replace(/"/g,'&quot;')}">${a.replace(/</g,'&lt;')}</option>`).join('')
    +'<option value="__new__">＋ 新しい担当者を追加…</option>';
  sel.value=current||'';
  const ni=document.getElementById('m-assignee-new');
  ni.value='';
  ni.style.display='none';
}
function onAssigneeChange(){
  const sel=document.getElementById('m-assignee');
  const ni=document.getElementById('m-assignee-new');
  const isNew=sel.value==='__new__';
  ni.style.display=isNew?'':'none';
  if(isNew)ni.focus();
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

async function saveTask(){
  const title=document.getElementById('m-title').value.trim();
  if(!title){alert('タイトルを入力してください');document.getElementById('m-title').focus();return;}
  const recurValue = document.getElementById('m-recur').value;
  const isNth = (recurValue==='毎月第◯曜日'||recurValue==='毎年第◯曜日');
  const sel=document.getElementById('m-assignee');
  const assignee = sel.value==='__new__' ? document.getElementById('m-assignee-new').value.trim() : sel.value;
  const prev = editId ? tasks.find(t=>t.notionId===editId) : null;
  const data={
    title,desc:document.getElementById('m-desc').value.trim(),
    assignee,
    start:document.getElementById('m-start').value,due:document.getElementById('m-due').value,
    status:prev?(prev.status||'未着手'):'未着手',
    recur:recurValue,
    recurWeek:isNth?document.getElementById('m-recur-week').value:'',
    recurWeekday:isNth?document.getElementById('m-recur-weekday').value:'',
    recurMonth:(recurValue==='毎年第◯曜日')?document.getElementById('m-recur-month').value:'',
  };
  closeModal();
  document.getElementById('saving-overlay').classList.add('show');
  try{
    if(editId&&prev){
      await updateInNotion(editId,data);
      Object.assign(prev,data);
    }else{
      const page=await createInNotion(data);
      tasks.push({...data,id:page.id,notionId:page.id});
    }
    setSyncStatus('ok','保存しました（'+new Date().toLocaleTimeString('ja-JP')+'）');
    render();
  }catch(e){
    setSyncStatus('err','保存失敗: '+e.message);
    alert('保存に失敗しました。\n'+e.message);
  }finally{
    document.getElementById('saving-overlay').classList.remove('show');
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
['must-input','must-when'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)addMust();}));

loadFromNotion();
</script>
